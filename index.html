<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romário</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="trofeu copa.png" type="image/png">
</head>

<body>
    <header>
        <div class="cabecalho">
            <img src="escudo.webp" class="foto-cabecalho" alt="Foto escudo 1994"
                title="seleção brasileira escudo 1994" />
            <h1>Romário</h1>
        </div>
    </header>
    <main>
        <h1>Galeria de fotos</h1>
        <section class="galeria">
            <div class="cartao">
                <img class="cartao-imagem" src="Secao-Brasileira-Copa-de-1994.jpg" alt="Foto seleção 1994" />
            </div>
            <div class="cartao">
                <img class="cartao-imagem" src="Flamengo 1997_2.png" alt="Foto Flamengo 1997" />
            </div>
            <div class="cartao">
                <img class="cartao-imagem" src="5fa3e4cd80336.jpeg" alt="Foto Barcelona 1994" />
            </div>
        </section>

        <h1>Video jogadas Romário</h1>
        <video src="golsRomario.mp4" muted autoplay loop></video>
        <div class="audio-mapa">
            <h1>Conheça o Estadio Maracanã</h1>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3675.03319391626!2d-43.23276392386153!3d-22.912146479251387!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x997e5dba888b0d%3A0xf5f33188ee6274e5!2zTWFyYWNhbsOj!5e0!3m2!1spt-BR!2sbr!4v1785503837507!5m2!1spt-BR!2sbr"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <audio src="É Tetra É Tetra É Tetra.mp3" controls></audio>
        </div>
    </main>
    <footer></footer>
</body>

</html>
